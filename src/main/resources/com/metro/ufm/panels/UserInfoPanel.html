<html xmlns:wicket="http://wicket.apache.org">
  <body>
    <wicket:panel>
      <div class="user-info-bar">
        <span>Username: <span wicket:id="username"></span></span>
        <span>Version: <span wicket:id="version"></span></span>
        <span wicket:id="currentDate"></span>
        <span wicket:id="currentTime"></span>
        <a wicket:id="logoutLink" class="logout-link" href="#">Logout</a>
      </div>
    </wicket:panel>
  </body>
</html>
